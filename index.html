<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Awen Codex</title>
  <style>
    body{margin:0;background:#151713;color:#eee8d8;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:720px;margin:auto;padding:24px 18px 80px}h1{font-size:28px;margin-bottom:4px}.sub{color:#aaa38f;margin-top:0}.card{background:#20231d;border:1px solid #3a3e32;border-radius:16px;padding:18px;margin:16px 0}button{width:100%;text-align:left;margin:6px 0;padding:14px;border:1px solid #555b49;border-radius:12px;background:#2a2e25;color:#f5f0df;font-size:16px}button:active{transform:scale(.99)}button:disabled{opacity:.4}button.secondary{background:#20231d}#message{white-space:pre-line;line-height:1.65}.item{padding:8px 0;border-bottom:1px solid #34382e}.muted{color:#aaa38f}.craft-order{padding:10px 0;line-height:1.6}.craft-buttons{margin:10px 0 14px}.void-window{min-height:54px;margin:12px 0;padding:12px;border:1px dashed #555b49;border-radius:12px;background:#11130f}.resonance-count{margin-bottom:0;font-size:14px}
  </style>
</head>
<body>
<main>
  <h1>Awen Codex</h1>
  <p class="sub">기원의 서 · Engine v0.3</p>
  <section id="place" class="card">불러오는 중...</section>
  <section class="card"><strong>행동</strong><div id="actions"></div></section>
  <section class="card"><strong>기록</strong><div id="message" class="muted">세계의 기억을 불러오고 있다.</div></section>
  <section class="card"><strong>인벤토리</strong><div id="inventory" class="muted">비어 있음</div></section>
  <section class="card"><strong>Resonancer</strong><div id="crafting"><span class="muted">공명 공간을 준비하는 중...</span></div></section>
</main>
<script type="module" src="./js/game.js"></script>
</body>
</html>
