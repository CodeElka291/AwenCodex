<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Awen Codex</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#151713;color:#eee8d8;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;overflow:hidden}.app{height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column;background:#151713}.story-pane{height:40%;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid #3a3e32;background:#171a15}.story-head{flex:0 0 auto;padding:12px 16px 8px;border-bottom:1px solid #2f332a}.story-title{font-size:17px;font-weight:700}.story-sub{font-size:12px;color:#8f8a79;margin-top:2px}.story-log{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 14px;scroll-behavior:smooth}.log-entry{white-space:pre-line;line-height:1.55;padding:8px 0;border-bottom:1px solid #292d25}.log-entry:last-child{border-bottom:0}.log-entry.action{color:#cfc8b2}.log-entry.system,.log-entry.failure,.log-entry.muted{color:#aaa38f}.log-entry.success{font-weight:700}.log-entry.error{color:#f0b8b8}.control-pane{height:60%;min-height:0;display:flex;flex-direction:column}.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-bottom:1px solid #34382e;background:#1c1f19}.tab-button{margin:0;padding:11px 8px;border:1px solid #444a3d;border-radius:10px;background:#252920;color:#bdb6a3;text-align:center;font-size:14px}.tab-button.active{background:#34392e;color:#fff4d4;border-color:#666d58}.panel-stack{flex:1;min-height:0;position:relative}.tab-panel{display:none;height:100%;overflow-y:auto;padding:14px 16px 24px}.tab-panel.active{display:block}.place-card{margin-bottom:12px}.place-card h2{font-size:22px;margin:0 0 6px}.place-card p{margin:0;color:#b9b29f;line-height:1.5}button{width:100%;text-align:left;margin:6px 0;padding:13px 14px;border:1px solid #555b49;border-radius:12px;background:#2a2e25;color:#f5f0df;font-size:16px}button:active{transform:scale(.99)}button:disabled{opacity:.4}button.secondary{background:#20231d}.muted{color:#aaa38f}.small{font-size:14px}.section-label{margin:14px 0 6px;font-weight:700}.resonance-order{padding:10px 0;line-height:1.6}.resonance-buttons{margin:10px 0 14px}.void-window{min-height:56px;margin:12px 0;padding:12px;border:1px dashed #555b49;border-radius:12px;background:#11130f}.resonance-count{margin-bottom:12px;font-size:14px}.held-item{padding:10px 0;border-bottom:1px solid #34382e}.empty-state{color:#aaa38f;padding:14px 0}.panel-heading{font-size:18px;font-weight:700;margin:0 0 10px}.panel-note{margin:0 0 10px;color:#aaa38f;line-height:1.5}@media (max-height:650px){.story-pane{height:38%}.control-pane{height:62%}.story-head{padding:8px 14px 6px}.story-log{padding:6px 14px 10px}.tab-panel{padding-top:10px}}
  </style>
</head>
<body>
<div class="app">
  <section class="story-pane">
    <div class="story-head">
      <div class="story-title">Awen Codex · 세계의 기록</div>
      <div class="story-sub">기원의 서 · Engine v0.4.1</div>
    </div>
    <div id="log" class="story-log"></div>
  </section>

  <section class="control-pane">
    <nav class="tabbar" aria-label="게임 메뉴">
      <button class="tab-button active" data-tab="explore">탐험</button>
      <button class="tab-button" data-tab="resonancer">Resonancer</button>
      <button class="tab-button" data-tab="inventory">인벤토리</button>
    </nav>

    <div class="panel-stack">
      <section id="panel-explore" class="tab-panel active">
        <div id="place" class="place-card">불러오는 중...</div>
        <div class="section-label">선택</div>
        <div id="actions"></div>
      </section>

      <section id="panel-resonancer" class="tab-panel">
        <h2 class="panel-heading">Resonancer</h2>
        <div id="resonancer"><span class="muted">공명 공간을 준비하는 중...</span></div>
      </section>

      <section id="panel-inventory" class="tab-panel">
        <h2 class="panel-heading">인벤토리</h2>
        <div id="inventory"></div>
      </section>
    </div>
  </section>
</div>
<script type="module" src="./js/game.js?v=0.4.1"></script>
</body>
</html>
